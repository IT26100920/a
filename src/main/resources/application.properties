# ---------- Application ----------
spring.application.name=movie-ticket-booking
# The Y1S2 demo starts with sample catalog data but not thousands of synthetic sales.
# Enable explicitly only when demonstrating the optional analytics module.
cinemax.demo.history=${CINEMAX_DEMO_HISTORY:false}
server.port=8070

# ---------- Database: MySQL or MariaDB (the only database of this project) ----------
# Every movie, showtime, booking, payment and customer is stored in a database called `movie_booking`.
# The schema is created automatically on startup by classpath:schema-mariadb.sql (see below), the
# tables are then filled from the import tables (import_movies / import_users / import_showtimes).
# `database/cinemax_mysql_setup.sql` (MySQL 8) or `database/cinemax_mariadb_setup.sql` (MariaDB,
# what XAMPP ships) can also create the same database, user and tables in advance.
#
# Nothing needs to be created by hand: an empty `movie_booking` schema is enough. On the very first
# start the 17 tables are created and filled with 45 accounts, 6 films, 36 showtimes and 2 promo
# codes, so you can log in straight away.
#
# XAMPP / MariaDB: XAMPP's "MySQL" is MariaDB (its version reads 5.5.5-10.x.y). It works with the
# defaults below, but add DB_DIALECT=org.hibernate.dialect.MariaDBDialect to the run configuration to
# remove the harmless "HHH000339" warning in the log.
#
# Default connection - this project's login, so the app starts with no extra setup:
#   host localhost - port 3306 - database movie_booking - user root - password 0000
# Change the default on the next two lines if your own login is different, or override it at run time
# without touching this file:
#   DB_HOST  DB_PORT  DB_NAME  DB_USER  DB_PASS
#   DB_DIALECT  (MySQLDialect for MySQL 8, MariaDBDialect for MariaDB)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:movie_booking}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=LOCAL&forceConnectionTimeZoneToSession=false
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:0000}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# READ COMMITTED: the seat-clash check runs after a pessimistic lock on the showtime row, so the waiting
# transaction must see the booking the other one just committed. MySQL's default (REPEATABLE READ) keeps its
# old snapshot and would let two customers book the same seat; READ COMMITTED gives the intended result.
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
# The dialect is set explicitly on purpose: with the property empty, Hibernate has to read the
# database metadata to guess it, and that lookup fails on some servers (MariaDB answers
# "Unknown column 'RESERVED'"), which stops the application from starting at all.
# Override with DB_DIALECT if you run MariaDB: org.hibernate.dialect.MariaDBDialect
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.hibernate.ddl-auto=update
# ---- The schema is created by a script, before Hibernate looks at it ----
# On MariaDB (what XAMPP's "MySQL" actually is) Hibernate's update cannot create the tables:
# it sends "alter table ... modify column ... enum (...)" first and MariaDB rejects all of them,
# so the schema stays empty. schema-mariadb.sql creates the 14 tables idempotently on every start,
# and update then finds everything already in place and changes nothing. Safe to run repeatedly -
# CREATE TABLE IF NOT EXISTS only, existing rows are never touched. Works on MySQL 8 as well.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-mariadb.sql
# The script repeats its "add column / add index" statements on every start; the second time they
# already exist and the error is expected, so it is ignored instead of stopping the application.
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=false
spring.jpa.open-in-view=false
# A booking's seat list is its own small query; batches of 50 keep lists and reports at one round trip each.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.show-sql=false
# Give a readable error instead of a long stack trace when the database server is not running.
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=10000

# ---------- JSON ----------
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- Reports (timestamped text reports land here) ----------

app.data.reports-dir=data/reports
app.currency=LKR

# ---------- Customer email (confirmations, show reminders, hold expiry) ----------
# outbox (default): emails are written to data/outbox/outbox.txt. Nothing is sent to the internet.
# smtp: emails are sent through the SMTP server below. Set these as environment variables, never in code:
#   APP_EMAIL_MODE=smtp  SMTP_HOST  SMTP_PORT  SMTP_USER  SMTP_PASS  SMTP_STARTTLS  SMTP_AUTH  MAIL_FROM
app.email.mode=${APP_EMAIL_MODE:outbox}
app.email.from=${MAIL_FROM:CineMax <bookings@cinemax.lk>}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ---------- Show reminders (customer notifications) ----------
app.reminders.interval-ms=60000
app.reminders.initial-delay-ms=15000

# ---------- Seat holds ----------
# Unpaid bookings keep their seats for this many minutes, then the seats are released.
app.booking.hold-minutes=10
app.booking.hold-sweep-ms=30000

# ---------- Sessions and cookies (admin security) ----------
# Idle sessions end after 30 minutes. The session cookie is HttpOnly (not readable by page scripts)
# and SameSite=Lax (not sent on cross-site form posts).
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Secure = the browser only sends the session cookie over HTTPS. Keep false for local http:// demos;
# set SESSION_COOKIE_SECURE=true once the site is served over HTTPS.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# ---------------------------------------------------------------------------
# OpenAPI / Swagger UI (Tier 3)
# The live API document is at /v3/api-docs and the browsable page at /swagger-ui.html.
# Swagger UI is only an aid for developers: it is switched off in production by setting
# SPRINGDOC_ENABLED=false.
# ---------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.default-models-expand-depth=-1
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
